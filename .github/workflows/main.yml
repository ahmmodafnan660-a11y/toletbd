name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build
        run: |
          flutter create tolet_app
          cp lib/main.dart tolet_app/lib/main.dart
          cd tolet_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ToLetBD-APK
          path: tolet_app/build/app/outputs/flutter-apk/app-release.apk
